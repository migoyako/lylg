name: 前端任务
about: 图书借阅系统前端页面与交互
labels:
  - frontend
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 说明需要完成的页面与交互。
    validations:
      required: true
  - type: checkboxes
    id: acceptance
    attributes:
      label: 验收标准
      options:
        - label: 列表、查询、详情、新增、修改和删除交互与试卷效果一致
          required: true
        - label: 页面适配桌面与移动端，表单提供必要校验
          required: true
